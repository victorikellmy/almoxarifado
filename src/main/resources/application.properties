spring.application.name=aualmoxarifado

# =============================================================================
# PERFIL DEFAULT = PRODUCAO (container Docker + PostgreSQL dedicado)
#
# Este arquivo NAO contem host, porta, usuario ou senha de banco. Tudo vem de
# variaveis de ambiente, resolvidas pelo BancoDeDadosEnvPostProcessor:
#
#   DATABASE_URL  postgresql://usuario:senha@host:5432/banco   (precedencia)
#   -- ou --
#   DB_HOST / DB_PORT (default 5432) / DB_NAME / DB_USER / DB_PASSWORD
#
# Sem essas variaveis o boot FALHA com mensagem clara - nao ha fallback para
# localhost. Desenvolvimento local usa o perfil "dev" (H2 em memoria):
#   gradlew bootRun   (ja ativa o dev sozinho)
# =============================================================================

spring.docker.compose.enabled=false

# ===== Schema: criado SOMENTE por migration (Flyway) =====
# validate = Hibernate confere se o schema criado pelo Flyway bate com as
# entidades e aborta o boot se divergir. Nunca create/update em producao.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Startup resiliente: o container da app pode subir antes do Postgres aceitar
# conexoes. O Flyway tenta reconectar por ate ~60s antes de desistir.
spring.flyway.connect-retries=30
spring.flyway.connect-retries-interval=2

# ===== HTTP: container atras de proxy reverso (Nginx Proxy Manager) =====
# 0.0.0.0 para ser alcancavel de fora do container; porta via $PORT.
server.address=0.0.0.0
server.port=${PORT:8080}
# Confia em X-Forwarded-For/Proto/Host - sem isso as URLs absolutas saem com
# http:// e o navegador entra em loop de redirect atras do HTTPS do proxy.
server.forward-headers-strategy=framework

# Cookies de sessao coerentes com HTTPS terminado no proxy.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===== Bootstrap do usuario administrador (unico "seed" de producao) =====
# So roda com a tabela de usuarios VAZIA. Sem default para a senha: se o banco
# estiver vazio e ADMIN_PASSWORD nao vier, o boot falha explicando o motivo.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# ===== Uploads (RF16) - unico diretorio de escrita da aplicacao =====
# Monte um volume neste caminho; fora dele nada e gravado em disco.
app.uploads.dir=${UPLOADS_DIR:/data/uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ===== Healthcheck do container =====
# GET /actuator/health -> 200 com app+banco ok; 503 se o banco cair.
# Sem autenticacao (liberado no SecurityConfig) e sem detalhes de infra no corpo.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
