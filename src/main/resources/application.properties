spring.application.name=aualmoxarifado

# Perfil ativo default para desenvolvimento local ("dev" liga o DataSeeder e o H2).
# Em produção, sobrescreva com a variável de ambiente SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=dev

# ===== Pool de conexões (HikariCP) =====
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=20000

# ===== JPA / Hibernate — performance =====
# Agrupa INSERTs/UPDATEs em lotes JDBC (importação, seed, movimentações multi-item).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Converte N+1 de relações lazy em consultas IN batched (50 proxies por SELECT).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ===== Web — compressão e cache de estáticos =====
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/csv,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
# Content-hash no nome dos assets: permite max-age de 1 ano com invalidação automática.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Teto de tamanho de página nas APIs (o default do Spring aceitaria size=2000).
spring.data.web.pageable.max-page-size=100

# ===== Sessão web =====
# Timeout explícito da sessão (o default do container é ~30min). Reduz a janela
# de uma sessão esquecida aberta. Só afeta o fluxo web; a API é stateless.
server.servlet.session.timeout=30m
# Cookie de sessão: HttpOnly (default) + SameSite=Lax evita envio cross-site do
# JSESSIONID, mitigando CSRF/vazamento do cookie por navegação de terceiros.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===== Módulo de Compras (RF16) — uploads de PDF =====
# Diretório onde os anexos (PDF de Solicitação e de Nota Fiscal) são gravados.
# O AnexoStorageService cria automaticamente este diretório no startup.
app.uploads.dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
