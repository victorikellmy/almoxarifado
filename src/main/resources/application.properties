spring.application.name=aualmoxarifado

# Inclui o correlationId (MDC) em cada linha de log — rastreio entre servicos
logging.pattern.level=%5p [%X{correlationId:-}]

# Perfil ativo - "dev" liga o DataSeeder. Remova/troque para desativar.
spring.profiles.active=dev

# Desabilita suporte ao Docker Compose (H2 em memória nao precisa)
spring.docker.compose.enabled=false

# ===== Banco H2 (desenvolvimento) =====
spring.datasource.url=jdbc:h2:mem:almoxarifado;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA — schema gerido pelo Flyway; Hibernate apenas valida =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== Flyway (dev: roda as migracoes no H2 em modo PostgreSQL) =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Módulo de Compras (RF16) — uploads de PDF =====
# Diretório onde os anexos (PDF de Solicitação e de Nota Fiscal) são gravados.
# O AnexoStorageService cria automaticamente este diretório no startup.
app.uploads.dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ===== Para usar PostgreSQL no futuro, comente as linhas H2 e descomente:
