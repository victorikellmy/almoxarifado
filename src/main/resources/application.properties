spring.application.name=aualmoxarifado

# =============================================================================
# PERFIL DEFAULT = PRODUCAO (container Docker + PostgreSQL dedicado)
#
# Este arquivo NAO contem host, porta, usuario ou senha de banco. Tudo vem de
# variaveis de ambiente, resolvidas pelo BancoDeDadosEnvPostProcessor:
#
#   DATABASE_URL  postgresql://usuario:senha@host:5432/banco   (precedencia)
#   -- ou --
#   DB_HOST / DB_PORT (default 5432) / DB_NAME / DB_USER / DB_PASSWORD
#
# Sem essas variaveis o boot FALHA com mensagem clara - nao ha fallback para
# localhost. Desenvolvimento local usa o perfil "dev" (H2 em memoria):
#   gradlew bootRun   (ja ativa o dev sozinho)
# =============================================================================

spring.docker.compose.enabled=false

# ===== Schema: criado SOMENTE por migration (Flyway) =====
# validate = Hibernate confere se o schema criado pelo Flyway bate com as
# entidades e aborta o boot se divergir. Nunca create/update em producao.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Startup resiliente: o container da app pode subir antes do Postgres aceitar
# conexoes. O Flyway tenta reconectar por ate ~60s antes de desistir.
spring.flyway.connect-retries=30
spring.flyway.connect-retries-interval=2

# ===== Pool de conexoes (HikariCP) =====
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=20000

# ===== JPA / Hibernate - performance =====
# Agrupa INSERTs/UPDATEs em lotes JDBC (importacao, seed, movimentacoes multi-item).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Converte N+1 de relacoes lazy em consultas IN batched (50 proxies por SELECT).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ===== HTTP: container atras de proxy reverso (Nginx Proxy Manager) =====
# 0.0.0.0 para ser alcancavel de fora do container; porta via $PORT.
server.address=0.0.0.0
server.port=${PORT:8080}
# Confia em X-Forwarded-For/Proto/Host - sem isso as URLs absolutas saem com
# http:// e o navegador entra em loop de redirect atras do HTTPS do proxy.
server.forward-headers-strategy=framework

# ===== Web - compressao e cache de estaticos =====
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/csv,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
# Content-hash no nome dos assets: permite max-age de 1 ano com invalidacao automatica.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Teto de tamanho de pagina nas APIs (o default do Spring aceitaria size=2000).
spring.data.web.pageable.max-page-size=100

# ===== Sessao web =====
# Timeout explicito da sessao (o default do container e ~30min). Reduz a janela
# de uma sessao esquecida aberta. So afeta o fluxo web; a API e stateless.
server.servlet.session.timeout=30m
# Cookies de sessao coerentes com HTTPS terminado no proxy.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===== Bootstrap do usuario administrador (unico "seed" de producao) =====
# So roda com a tabela de usuarios VAZIA. Sem default para a senha: se o banco
# estiver vazio e ADMIN_PASSWORD nao vier, o boot falha explicando o motivo.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# ===== CORS da API REST consumida pelo app mobile =====
# Default "*" porque o consumidor principal e o app Android nativo (OkHttp, fora
# do escopo de CORS). Para um front web, restrinja a allowlist por ambiente.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===== Uploads (RF16) - unico diretorio de escrita da aplicacao =====
# Monte um volume neste caminho; fora dele nada e gravado em disco.
app.uploads.dir=${UPLOADS_DIR:/data/uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ===== Compras: leitura automatica do PDF da Parte/Oficio em "Nova pre-compra" =====
# A leitura de texto (PDFBox) e sempre ativa. A leitura assistida por IA (Claude) e
# opcional e serve para PDFs escaneados (imagem): habilite com true e defina a
# variavel de ambiente ANTHROPIC_API_KEY.
compras.ia.habilitada=${COMPRAS_IA_HABILITADA:false}
compras.ia.modelo=${COMPRAS_IA_MODELO:claude-opus-5-5}

# ===== Usuarios do setor de Compras/Almoxarifado =====
# Criados no primeiro boot (se ainda nao existirem) com o perfil COMPRAS e a senha
# inicial abaixo; em producao defina COMPRAS_SENHA_INICIAL (sem ela, o seeder pula
# e os usuarios podem ser criados pela tela /usuarios). Cada um troca a senha no
# primeiro acesso em "Alterar senha".
compras.usuarios.senha-inicial=${COMPRAS_SENHA_INICIAL:}

# ===== Integracao com o Gerenciador Patrimonial =====
# Recebimentos marcados como "sera patrimoniado" sao enviados para
# POST {PATRIMONIO_URL}/api/integracao/almoxarifado/recebimentos com HTTP Basic.
# Sem PATRIMONIO_URL a integracao fica desligada e os envios aguardam na fila.
patrimonio.url=${PATRIMONIO_URL:}
patrimonio.usuario=${PATRIMONIO_USUARIO:}
patrimonio.senha=${PATRIMONIO_SENHA:}
# Reenvio automatico dos pendentes/erros (ms). Default: a cada 10 minutos.
patrimonio.reenvio-intervalo-ms=${PATRIMONIO_REENVIO_MS:600000}

# ===== Healthcheck do container =====
# GET /actuator/health -> 200 com app+banco ok; 503 se o banco cair.
# Sem autenticacao (liberado no SecurityConfig) e sem detalhes de infra no corpo.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
