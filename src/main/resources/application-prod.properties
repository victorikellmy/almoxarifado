# ===== Perfil PROD — PostgreSQL, sem ferramentas de debug =====
# Ative com SPRING_PROFILES_ACTIVE=prod e defina as credenciais por variável
# de ambiente (nunca commitar senha).

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/almoxarifado}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Em produção o schema deve ser gerido por migração (Flyway/Liquibase);
# validate garante que o mapeamento bate com o banco sem alterá-lo.
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
spring.docker.compose.enabled=false

# Cookie de sessão só trafega sobre HTTPS em produção (evita captura em texto claro).
server.servlet.session.cookie.secure=true
