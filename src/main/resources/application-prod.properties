# =============================================================================
# Perfil PROD — PostgreSQL + Flyway. Padrão do ecossistema FPTO.
# Ative com: --spring.profiles.active=prod
# Segredos via variáveis de ambiente (NUNCA commitar).
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/almoxarifado}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema gerido pelo Flyway; Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Console H2 desligado em produção
spring.h2.console.enabled=false

# DataSeeder NÃO roda em prod (é @Profile("dev"))
