# =============================================================================
# PERFIL TEST - testes automatizados (JUnit).
#
# H2 em memoria por velocidade e isolamento. DECISAO REGISTRADA: os testes NAO
# rodam contra PostgreSQL nesta maquina (sem Docker disponivel); o schema de
# producao e validado pelo Flyway + ddl-auto=validate no primeiro boot real.
# Se quiser testes contra Postgres no futuro, o caminho e Testcontainers.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:almoxarifado-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.jpa.show-sql=false

server.servlet.session.cookie.secure=false

# Os testes de autenticacao validam o admin inicial com esta senha.
app.admin.username=admin
app.admin.password=Famsaudepm.

app.uploads.dir=./build/test-uploads
