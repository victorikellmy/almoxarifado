# =============================================================================
# PERFIL HOMOLOG - ambiente de homologacao no PC, para testar web + app.
#
#   ./gradlew bootRun --args="--spring.profiles.active=homolog"
#
# H2 em memoria: o banco ZERA a cada reinicio e e repopulado do zero pelo
# DataSeeder + HomologacaoSeeder (massa cobrindo todos os fluxos). Nada aqui
# vale em producao. Roteiro de testes: docs/HOMOLOGACAO.md.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:homolog;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# As migrations sao escritas para PostgreSQL; em H2 o Hibernate cria o schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Escuta em todas as interfaces: o celular acessa pelo IP do PC na rede.
# Porta 8081 para conviver com o dev/IntelliJ, que costuma ocupar a 8080.
server.address=0.0.0.0
server.port=8081
# Sem HTTPS local - cookie Secure desligado para a sessao web funcionar.
server.servlet.session.cookie.secure=false

# ----- Usuarios de homologacao (senha unica, so deste ambiente) -----
app.admin.username=admin
app.admin.password=homolog123
compras.usuarios.senha-inicial=homolog123
homolog.senha=homolog123

# Uploads separados do dev/producao.
app.uploads.dir=./uploads-homolog

# Integracao com o Patrimonio desligada: envios ficam na fila (visivel na tela).
patrimonio.url=
