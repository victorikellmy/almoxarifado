<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trocar senha')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(null)}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Trocar senha', 'Atualize a senha da sua conta')}"></header>

        <div class="app-content">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <form th:action="@{/minha-conta/senha}" th:object="${form}" method="post" class="card">
                        <div class="card-pad">
                            <h6 class="text-muted text-uppercase small mb-3" style="letter-spacing:.05em;">
                                <i class="bi bi-key"></i> Credenciais
                            </h6>

                            <div class="mb-3">
                                <label class="form-label">Senha atual *</label>
                                <input type="password" class="form-control" th:field="*{senhaAtual}" required/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('senhaAtual')}"
                                     th:errors="*{senhaAtual}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nova senha *</label>
                                <input type="password" class="form-control" th:field="*{novaSenha}"
                                       required minlength="6"/>
                                <div class="form-text">Mínimo 6 caracteres.</div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('novaSenha')}"
                                     th:errors="*{novaSenha}"></div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Confirmar nova senha *</label>
                                <input type="password" class="form-control" th:field="*{confirmarSenha}" required/>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
                                <a th:href="@{/}" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
