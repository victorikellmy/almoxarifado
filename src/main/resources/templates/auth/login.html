<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Entrar · Almoxarifado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="login-page">
<div class="w-100" style="max-width:420px;">
    <div class="brand">
        <div class="brand-icon"><i class="bi bi-box-seam"></i></div>
        <h4 class="mb-0">Almoxarifado</h4>
        <small class="text-white-50">Sistema de Gestão de Estoque</small>
    </div>

    <div class="card login-card shadow-lg">
        <div class="card-body p-4">
            <h5 class="mb-4"><i class="bi bi-person-lock text-primary"></i> Entrar no sistema</h5>

            <div th:if="${erro}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${erro}"></span>
            </div>
            <div th:if="${info}" class="alert alert-info" role="alert">
                <i class="bi bi-info-circle-fill"></i> <span th:text="${info}"></span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Login</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" name="username"
                               autofocus required autocomplete="username"
                               placeholder="seu.usuario"/>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" name="password"
                               required autocomplete="current-password"
                               placeholder="••••••••"/>
                    </div>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>
        </div>
    </div>
    <div class="text-center text-white-50 small mt-3">
        v0.0.1-SNAPSHOT
    </div>
</div>
</body>
</html>
