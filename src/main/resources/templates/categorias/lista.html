<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container"><a class="navbar-brand" href="/">Almoxarifado</a></div>
</nav>
<div class="container py-4">
    <h2>Categorias <small class="text-muted">(RF11)</small></h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/categorias}" th:object="${categoria}" method="post" class="card p-3 mb-4 shadow-sm">
        <div class="row g-2">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Nome" th:field="*{nome}" required>
            </div>
            <div class="col-md-7">
                <input type="text" class="form-control" placeholder="Descrição" th:field="*{descricao}">
            </div>
            <div class="col-md-1">
                <button class="btn btn-primary w-100">Salvar</button>
            </div>
        </div>
    </form>

    <table class="table table-striped bg-white shadow-sm align-middle">
        <thead class="table-dark">
        <tr><th>#</th><th>Nome</th><th>Descrição</th><th class="text-end">Ações</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nome}"></td>
            <td th:text="${c.descricao} ?: '-'"></td>
            <td class="text-end">
                <!-- RN07 - exclusão protegida no backend -->
                <form th:action="@{|/categorias/${c.id}/excluir|}" method="post" class="d-inline"
                      onsubmit="return confirm('Excluir esta categoria?');">
                    <button class="btn btn-sm btn-outline-danger">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
