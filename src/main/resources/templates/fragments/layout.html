<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragments compartilhados de layout (Thymeleaf) — visual unificado com o
  Gerenciador Patrimonial (Claude Design / Sidebar Edition).

  API mantida para compatibilidade com as páginas atuais:
    <head th:replace="~{fragments/layout :: head('Titulo')}"></head>
    <aside th:replace="~{fragments/layout :: sidebar('chave')}"></aside>
    <header th:replace="~{fragments/layout :: topbar('Titulo', 'Subtitulo')}"></header>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
-->

<!-- ============================ HEAD ============================ -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${titulo} + ' · Almoxarifado'">Almoxarifado</title>

    <!-- Favicon institucional -->
    <link rel="icon" type="image/png" th:href="@{/images/logo-color-vert.png}"/>
    <link rel="apple-touch-icon" th:href="@{/images/logo-color-vert.png}"/>

    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
          rel="stylesheet"/>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet"/>

    <!-- CSS custom (Claude Design — compartilhado com o Patrimônio) -->
    <link rel="stylesheet" th:href="@{/css/app.css}"/>

    <!-- Aplica o tema antes do render para evitar flash -->
    <script>
        (function () {
            var stored = localStorage.getItem('alm-theme');
            var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', stored || prefers);

            var sidebar = localStorage.getItem('alm-sidebar');
            if (sidebar === 'collapsed') {
                document.documentElement.classList.add('sidebar-collapsed');
            }
        })();
    </script>

    <!-- Compat layer: preserva o shell .app-shell / .app-main / .app-content
         usado pelas páginas existentes, sobre o CSS do Patrimônio.
         Também garante que a topbar comporte título + subtítulo. -->
    <style>
        .app-shell { min-height: 100vh; }
        .app-main { display: flex; flex-direction: column; min-width: 0; }
        .app-content { padding: 1.75rem 2rem 2.5rem; }
        @media (max-width: 991px) { .app-content { padding: 1rem; } }

        /* Override do app.css que empurrava o <main> 20px para baixo,
           desalinhando a topbar do brand fixo da sidebar. */
        body:has(.app-sidebar) main.app-main { padding-top: 0; }

        /* ============ Stat cards (indicadores) ============ */
        .stat-card {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1.25rem;
            border-radius: 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
            min-height: 100%;
        }
        a > .stat-card,
        .hover-shadow:hover {
            box-shadow: var(--shadow-2);
            border-color: var(--border-hover, var(--primary-300));
        }
        a > .stat-card:hover { transform: translateY(-1px); }

        .stat-card > div:last-child {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: .25rem;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
        }
        .stat-icon.bg-brand        { background: var(--primary-50);  color: var(--primary-700); }
        .stat-icon.bg-warning-soft { background: var(--warning-bg);  color: var(--warning-fg); }
        .stat-icon.bg-info-soft    { background: var(--info-bg);     color: var(--info-fg); }
        .stat-icon.bg-success-soft { background: var(--success-bg);  color: var(--success-fg); }
        [data-theme="dark"] .stat-icon.bg-brand {
            background: rgba(39, 118, 173, 0.18);
            color: var(--primary-300);
        }

        .stat-label {
            margin: 0;
            font-size: .78rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .03em;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-value {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
            letter-spacing: -.02em;
            font-variant-numeric: tabular-nums;
        }
        .stat-hint {
            margin: 0;
            font-size: .78rem;
            color: var(--text-muted);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-hint a { color: var(--primary-600); font-weight: 500; }

        /* Card padding helper usado pelas seções */
        .card-pad { padding: 1.25rem 1.5rem; }
        .hover-shadow { transition: box-shadow var(--transition), transform var(--transition); }
        .hover-shadow:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
        .min-w-0 { min-width: 0; }

        /* Topbar com título + subtítulo — altura travada na mesma do brand
           da sidebar (var(--topbar-h)) para alinhar visualmente com o logo. */
        .app-topbar {
            height: var(--topbar-h);
            min-height: var(--topbar-h);
            max-height: var(--topbar-h);
            padding: 0 1.5rem;
        }
        .app-topbar .topbar-page-title {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.15;
            min-width: 0;
        }
        .app-topbar .topbar-page-title h1 {
            font-size: 1rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: -.01em;
            color: var(--text-primary);
        }
        .app-topbar .topbar-page-title p {
            margin: 2px 0 0;
            font-size: .75rem;
            color: var(--text-muted);
            line-height: 1.1;
        }
    </style>
</head>

<!-- ============================ SIDEBAR ============================ -->
<aside th:fragment="sidebar(ativo)" class="app-sidebar" id="appSidebar" aria-label="Navegação principal">
    <div class="sidebar-brand">
        <a class="sidebar-brand-link" th:href="@{/}">
            <img th:src="@{/images/logo-color.png}" alt="Fundação Pró-Tocantins"
                 class="sidebar-brand-logo sidebar-brand-logo-light"/>
            <img th:src="@{/images/logo-white.png}" alt="Fundação Pró-Tocantins"
                 class="sidebar-brand-logo sidebar-brand-logo-dark"/>
            <span class="sidebar-brand-mark-collapsed" aria-hidden="true">
                <i class="bi bi-box-seam"></i>
            </span>
            <span class="sidebar-brand-text">
                <span class="sidebar-brand-title">Almoxarifado</span>
            </span>
        </a>
        <button type="button" class="sidebar-collapse-btn d-none d-lg-inline-flex"
                id="sidebarCollapseBtn"
                title="Recolher menu" aria-label="Recolher menu">
            <i class="bi bi-chevron-double-left"></i>
        </button>
    </div>

    <nav class="sidebar-nav">
        <div class="sidebar-section">
            <div class="sidebar-section-title">Visão geral</div>
            <a class="sidebar-link" th:classappend="${ativo == 'home'} ? 'active'" th:href="@{/}">
                <i class="bi bi-speedometer2"></i>
                <span class="sidebar-link-label">Dashboard</span>
            </a>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-section-title">Catálogo</div>
            <a class="sidebar-link" th:classappend="${ativo == 'areas'} ? 'active'" th:href="@{/areas}">
                <i class="bi bi-diagram-3"></i>
                <span class="sidebar-link-label">Áreas</span>
            </a>
            <a class="sidebar-link" th:classappend="${ativo == 'subcategorias'} ? 'active'" th:href="@{/subcategorias}">
                <i class="bi bi-tags"></i>
                <span class="sidebar-link-label">Subcategorias</span>
            </a>
            <a class="sidebar-link" th:classappend="${ativo == 'materiais'} ? 'active'" th:href="@{/materiais}">
                <i class="bi bi-box-seam"></i>
                <span class="sidebar-link-label">Materiais</span>
            </a>
            <a class="sidebar-link" th:classappend="${ativo == 'setores'} ? 'active'" th:href="@{/setores}">
                <i class="bi bi-building"></i>
                <span class="sidebar-link-label">Setores</span>
            </a>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-section-title">Operações</div>
            <a class="sidebar-link" th:classappend="${ativo == 'compras'} ? 'active'" th:href="@{/compras}">
                <i class="bi bi-cart3"></i>
                <span class="sidebar-link-label">Compras</span>
            </a>
            <a class="sidebar-link" th:classappend="${ativo == 'compras-fila'} ? 'active'" th:href="@{/compras/aguardando}">
                <i class="bi bi-hourglass-split"></i>
                <span class="sidebar-link-label">Fila de compras</span>
            </a>
            <a class="sidebar-link" th:classappend="${ativo == 'movimentacoes'} ? 'active'" th:href="@{/movimentacoes}">
                <i class="bi bi-arrow-left-right"></i>
                <span class="sidebar-link-label">Movimentações</span>
            </a>
            <a class="sidebar-link" th:classappend="${ativo == 'saida-nova'} ? 'active'" th:href="@{/movimentacoes/saida/nova}">
                <i class="bi bi-box-arrow-up"></i>
                <span class="sidebar-link-label">Nova saída</span>
            </a>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-section-title">Relatórios</div>
            <a class="sidebar-link" th:classappend="${ativo == 'rel-consumo'} ? 'active'"
               th:href="@{/movimentacoes/relatorio/consumo-setor}">
                <i class="bi bi-bar-chart"></i>
                <span class="sidebar-link-label">Consumo por setor</span>
            </a>
        </div>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <span class="nav-avatar">A</span>
            <div class="sidebar-user-info">
                <span class="sidebar-user-name">Almoxarifado</span>
                <span class="sidebar-user-role">Fundação · 2025</span>
            </div>
        </div>
    </div>
</aside>

<!-- Backdrop para mobile drawer (renderizado junto da sidebar) -->
<div th:fragment="sidebarBackdrop" class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

<!-- ============================ TOPBAR ============================ -->
<header th:fragment="topbar(titulo, subtitulo)" class="app-topbar">
    <button type="button" class="topbar-icon-btn d-lg-none" id="sidebarOpenBtn"
            aria-label="Abrir menu" title="Abrir menu">
        <i class="bi bi-list"></i>
    </button>
    <button type="button" class="topbar-icon-btn d-none d-lg-inline-flex" id="sidebarToggleBtn"
            aria-label="Alternar menu" title="Alternar menu">
        <i class="bi bi-layout-sidebar"></i>
    </button>

    <div class="topbar-page-title">
        <h1 th:text="${titulo}">Página</h1>
        <p th:if="${subtitulo}" th:text="${subtitulo}"></p>
    </div>

    <div class="topbar-spacer"></div>

    <span class="text-muted small d-none d-md-inline">
        <i class="bi bi-calendar3 me-1"></i>
        <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span>
    </span>

    <div class="topbar-divider d-none d-md-block"></div>

    <button type="button" class="topbar-icon-btn theme-toggle" id="themeToggleBtn"
            title="Alternar tema claro/escuro" aria-label="Alternar tema">
        <i class="bi bi-moon-stars" id="themeIconDark"></i>
        <i class="bi bi-sun" id="themeIconLight" style="display:none"></i>
    </button>
</header>

<!-- ============================ FLASH MESSAGES ============================ -->
<div th:fragment="messages">
    <div class="toast-container" th:if="${sucesso != null or erro != null}">
        <div th:if="${sucesso}" class="toast-modern toast-success" role="alert" data-toast-autohide="4000">
            <div class="toast-icon"><i class="bi bi-check-lg"></i></div>
            <div class="toast-body-modern">
                <div class="toast-title">Sucesso</div>
                <div class="toast-desc" th:text="${sucesso}">Operação realizada.</div>
            </div>
            <button type="button" class="toast-close" aria-label="Fechar">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div th:if="${erro}" class="toast-modern toast-danger" role="alert" data-toast-autohide="6000">
            <div class="toast-icon"><i class="bi bi-exclamation-triangle"></i></div>
            <div class="toast-body-modern">
                <div class="toast-title">Atenção</div>
                <div class="toast-desc" th:text="${erro}">Erro.</div>
            </div>
            <button type="button" class="toast-close" aria-label="Fechar">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>
</div>

<!-- ============================ SCRIPTS ============================ -->
<th:block th:fragment="scripts">
    <!-- Backdrop drawer mobile (injetado aqui para não poluir o body das pages) -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>

    <script>
        // ---------- Theme toggle ----------
        (function () {
            const btn = document.getElementById('themeToggleBtn');
            if (!btn) return;
            const iconDark = document.getElementById('themeIconDark');
            const iconLight = document.getElementById('themeIconLight');
            const sync = () => {
                const dark = document.documentElement.getAttribute('data-theme') === 'dark';
                iconDark.style.display = dark ? 'none' : '';
                iconLight.style.display = dark ? '' : 'none';
            };
            sync();
            btn.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('alm-theme', next);
                sync();
            });
        })();

        // ---------- Sidebar: collapse desktop + drawer mobile ----------
        (function () {
            const root = document.documentElement;
            const sidebar = document.getElementById('appSidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            const openBtn = document.getElementById('sidebarOpenBtn');
            const toggleBtn = document.getElementById('sidebarToggleBtn');
            const collapseBtn = document.getElementById('sidebarCollapseBtn');

            const toggleCollapsed = () => {
                root.classList.toggle('sidebar-collapsed');
                localStorage.setItem('alm-sidebar',
                    root.classList.contains('sidebar-collapsed') ? 'collapsed' : 'expanded');
            };

            const openMobile = () => {
                sidebar?.classList.add('is-open');
                backdrop?.classList.add('is-visible');
                document.body.style.overflow = 'hidden';
            };
            const closeMobile = () => {
                sidebar?.classList.remove('is-open');
                backdrop?.classList.remove('is-visible');
                document.body.style.overflow = '';
            };

            openBtn?.addEventListener('click', openMobile);
            backdrop?.addEventListener('click', closeMobile);
            toggleBtn?.addEventListener('click', toggleCollapsed);
            collapseBtn?.addEventListener('click', toggleCollapsed);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && sidebar?.classList.contains('is-open')) closeMobile();
            });
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 992) closeMobile();
            });
        })();

        // ---------- Toasts: auto-hide + fechar ----------
        (function () {
            document.querySelectorAll('.toast-modern').forEach((toast) => {
                const delay = parseInt(toast.dataset.toastAutohide || '0', 10);
                const close = () => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(20px)';
                    toast.style.transition = 'all 200ms ease-out';
                    setTimeout(() => toast.remove(), 200);
                };
                toast.querySelector('.toast-close')?.addEventListener('click', close);
                if (delay > 0) setTimeout(close, delay);
            });
        })();
    </script>
</th:block>

</html>
