<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Relatório trimestral')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('rel-trimestral')}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout ::
                              topbar('Relatório trimestral',
                                     'Comparativo mês-a-mês e custos do trimestre')}"></header>

        <div class="app-content">

            <!-- Filtro -->
            <div class="card mb-3">
                <div class="card-pad">
                    <form method="get" th:action="@{/relatorios/trimestral}" class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label">Ano</label>
                            <input type="number" name="ano" class="form-control" min="2000" max="2100"
                                   th:value="${ano}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Trimestre</label>
                            <select name="trimestre" class="form-select">
                                <option th:each="t : ${#numbers.sequence(1,4)}"
                                        th:value="${t}"
                                        th:text="${t + 'º trimestre'}"
                                        th:selected="${t == trimestre}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-funnel"></i> Filtrar
                            </button>
                        </div>
                        <div class="col-md-3">
                            <div th:replace="~{fragments/relatorio ::
                                              exportBar('/api/relatorios/trimestral/export',
                                                        |ano=${ano}&trimestre=${trimestre}|)}"></div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Cards de resumo por tipo (somatório do trimestre) -->
            <div class="row g-3 mb-3">
                <div th:replace="~{fragments/relatorio ::
                                  cardsResumoTipo(${dados.resumoPorTipo}, 'col-md-3')}"></div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon bg-warning-soft"><i class="bi bi-cash-stack"></i></div>
                        <div>
                            <p class="stat-label">Total do trimestre</p>
                            <p class="stat-value"
                               th:text="${'R$ ' + #numbers.formatDecimal(dados.totalGeral().valorTotal(), 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
                            <p class="stat-hint" th:text="${dados.labelTrimestre()}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Comparativo mês-a-mês -->
            <div class="card table-card mb-3">
                <div class="table-card-head">
                    <div>
                        <h5 class="mb-0" th:text="|Comparativo: ${dados.labelTrimestre()}|">Comparativo</h5>
                        <small class="text-muted">Movimentações e valores por mês</small>
                    </div>
                </div>
                <div class="table-responsive">
                    <table th:replace="~{fragments/relatorio ::
                                        tabelaMeses(${dados.meses}, ${dados.totaisMeses()},
                                                    'MMMM/yyyy', 'Total trimestre')}"></table>
                </div>
            </div>

            <!-- Gasto por setor -->
            <div class="card table-card">
                <div class="table-card-head">
                    <div>
                        <h5 class="mb-0">Gasto por setor</h5>
                        <small class="text-muted">Custo acumulado por setor no trimestre</small>
                    </div>
                </div>
                <div class="table-responsive">
                    <table th:replace="~{fragments/relatorio ::
                                        tabelaGastoPorSetor(${dados.gastoPorSetor},
                                                            'Itens', 'Valor total', 'bg-secondary',
                                                            'Sem gastos por setor no trimestre.')}"></table>
                </div>
            </div>

        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
