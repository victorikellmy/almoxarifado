<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Consumo por setor')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('rel-consumo')}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Consumo por setor', 'Quanto cada setor consumiu no período (RF10)')}"></header>

        <div class="app-content">

            <!-- Filtro de período -->
            <div class="card mb-4">
                <div class="card-pad">
                    <form method="get" th:action="@{/movimentacoes/relatorio/consumo-setor}"
                          class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label">Início</label>
                            <input type="date" name="inicio" class="form-control" th:value="${inicio}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fim</label>
                            <input type="date" name="fim" class="form-control" th:value="${fim}">
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-funnel"></i> Filtrar período
                            </button>
                        </div>
                    </form>
                    <p class="text-muted small mb-0 mt-3">
                        <i class="bi bi-info-circle"></i>
                        Considera saídas com status <strong>APROVADO</strong> ou <strong>ENTREGUE</strong>
                        e compras diretas (RN04/RN10).
                    </p>
                </div>
            </div>

            <div class="card table-card">
                <div class="table-card-head">
                    <div>
                        <h5 class="mb-0">Resultado</h5>
                        <small class="text-muted">
                            <span th:text="${#lists.size(consumos)}"></span> setor(es) com consumo no período
                        </small>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th style="width:60px">#</th>
                            <th>Setor</th>
                            <th>Centro de custo</th>
                            <th class="text-end">Total consumido</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c, it : ${consumos}">
                            <td>
                                <span class="badge"
                                      th:classappend="${it.count == 1} ? 'bg-warning' : 'bg-secondary'"
                                      th:text="${it.count}"></span>
                            </td>
                            <td class="fw-semibold" th:text="${c.nomeSetor}"></td>
                            <td>
                                <span th:if="${c.codigoCentroCusto}" class="badge bg-secondary"
                                      th:text="${c.codigoCentroCusto}"></span>
                                <span th:unless="${c.codigoCentroCusto}" class="text-muted">—</span>
                            </td>
                            <td class="text-end fw-bold" th:text="${c.totalConsumido}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(consumos)}">
                            <td colspan="4" class="empty-state">
                                <i class="bi bi-bar-chart d-block mb-2"></i>
                                Nenhum consumo registrado no período.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
