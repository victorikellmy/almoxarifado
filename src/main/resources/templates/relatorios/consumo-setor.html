<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Consumo por Setor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container"><a class="navbar-brand" href="/">Almoxarifado</a></div>
</nav>
<div class="container py-4">
    <h2>Relatório de Consumo por Setor <small class="text-muted">(RF10)</small></h2>
    <p class="text-muted">
        Considera apenas saídas com status <strong>APROVADO</strong> ou <strong>ENTREGUE</strong> (RN04).
    </p>

    <!-- Filtro de período -->
    <form method="get" th:action="@{/movimentacoes/relatorio/consumo-setor}" class="row g-2 align-items-end mb-4">
        <div class="col-auto">
            <label class="form-label">Início</label>
            <input type="date" name="inicio" class="form-control" th:value="${inicio}">
        </div>
        <div class="col-auto">
            <label class="form-label">Fim</label>
            <input type="date" name="fim" class="form-control" th:value="${fim}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Filtrar</button>
        </div>
    </form>

    <table class="table table-striped table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Setor</th>
            <th>Centro de Custo</th>
            <th class="text-end">Total Consumido</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c, it : ${consumos}">
            <td th:text="${it.count}"></td>
            <td th:text="${c.nomeSetor}"></td>
            <td th:text="${c.codigoCentroCusto} ?: '-'"></td>
            <td class="text-end fw-bold" th:text="${c.totalConsumido}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(consumos)}">
            <td colspan="4" class="text-center text-muted">Nenhum consumo registrado no período.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
