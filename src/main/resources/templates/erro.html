<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(null)}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Erro', 'Algo não saiu como esperado')}"></header>

        <div class="app-content">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card">
                        <div class="card-pad text-center py-5">
                            <div class="mx-auto mb-4 d-flex align-items-center justify-content-center
                                        rounded-circle"
                                 style="width:96px;height:96px;background:#fee2e2;color:#dc2626;">
                                <i class="bi bi-exclamation-octagon-fill" style="font-size:3rem;"></i>
                            </div>

                            <div class="text-muted small fw-semibold text-uppercase"
                                 style="letter-spacing:.1em;"
                                 th:text="'Erro ' + ${status}">Erro 500</div>

                            <h2 class="mt-2 mb-3 fw-bold" th:text="${titulo}">Algo deu errado</h2>

                            <p class="text-muted mx-auto mb-4" style="max-width:460px;"
                               th:text="${mensagem}">
                                Ocorreu um erro inesperado.
                            </p>

                            <div class="d-flex justify-content-center gap-2 flex-wrap">
                                <a class="btn btn-outline-secondary" href="javascript:history.back()">
                                    <i class="bi bi-arrow-left"></i> Voltar
                                </a>
                                <a class="btn btn-primary" th:href="@{/}">
                                    <i class="bi bi-house"></i> Ir para início
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
