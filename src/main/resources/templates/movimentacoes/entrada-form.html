<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Entrada de Material</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container"><a class="navbar-brand" href="/">Almoxarifado</a></div>
</nav>
<div class="container py-4">
    <h2>Nova Entrada de Estoque <small class="text-muted">(RF13)</small></h2>
    <p class="text-muted">
        Ao salvar, o saldo do material é <strong>automaticamente acrescido</strong> da quantidade recebida (RN05).
    </p>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/movimentacoes/entrada}" th:object="${movimentacao}" method="post" class="card p-4 shadow-sm">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Data da Entrada</label>
                <input type="datetime-local" class="form-control" th:field="*{data}">
            </div>

            <div class="col-md-8">
                <label class="form-label">Material</label>
                <select name="materialId" class="form-select" required>
                    <option value="">-- Selecione --</option>
                    <option th:each="m : ${materiais}"
                            th:value="${m.id}"
                            th:text="${m.nome + ' (saldo atual: ' + m.estoqueAtual + ')'}"></option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Quantidade Recebida</label>
                <input type="number" min="1" class="form-control" th:field="*{quantidade}" required>
            </div>

            <div class="col-md-5">
                <label class="form-label">Fornecedor</label>
                <input type="text" class="form-control" th:field="*{fornecedor}">
            </div>

            <div class="col-md-3">
                <label class="form-label">Nº Nota Fiscal <span class="text-muted">(opcional)</span></label>
                <input type="text" class="form-control" th:field="*{notaFiscal}">
            </div>
        </div>

        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-success">Registrar Entrada</button>
            <a href="/movimentacoes" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
