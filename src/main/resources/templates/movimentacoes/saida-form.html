<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Saída de Material</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container"><a class="navbar-brand" href="/">Almoxarifado</a></div>
</nav>
<div class="container py-4">
    <h2>Nova Saída de Material <small class="text-muted">(RF06)</small></h2>

    <!-- Mensagem de erro retornada pela RN03 (setor obrigatório) ou estoque insuficiente -->
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/movimentacoes/saida}" th:object="${movimentacao}" method="post" class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label">Data</label>
            <input type="datetime-local" class="form-control" th:field="*{data}">
        </div>

        <div class="mb-3">
            <label class="form-label">Material</label>
            <select name="materialId" class="form-select" required>
                <option value="">-- Selecione --</option>
                <option th:each="m : ${materiais}"
                        th:value="${m.id}"
                        th:text="${m.nome + ' (saldo: ' + m.estoqueAtual + ')'}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantidade</label>
            <input type="number" min="1" class="form-control" th:field="*{quantidade}" required>
        </div>

        <!-- RN03 - Setor obrigatório. O atributo "required" garante validação no front;
             a validação definitiva é feita no MovimentacaoService. -->
        <div class="mb-3">
            <label class="form-label">Setor de Destino <span class="text-danger">*</span></label>
            <select name="setorId" class="form-select" required>
                <option value="">-- Selecione o setor --</option>
                <option th:each="s : ${setores}"
                        th:value="${s.id}"
                        th:text="${s.nome + (s.codigoCentroCusto != null ? ' [' + s.codigoCentroCusto + ']' : '')}"></option>
            </select>
            <div class="form-text">Obrigatório por força da regra RN03.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Quem retirou</label>
            <input type="text" class="form-control" th:field="*{retiradoPor}">
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Registrar Saída</button>
            <a href="/movimentacoes" class="btn btn-outline-secondary">Cancelar</a>
        </div>
        <p class="form-text mt-3">
            A saída nasce com status <strong>PENDENTE_APROVACAO</strong> (RN04).
            O estoque só será debitado após aprovação do gestor.
        </p>
    </form>
</div>
</body>
</html>
