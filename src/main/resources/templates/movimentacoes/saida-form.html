<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nova saída')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('saida-nova')}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Nova saída de material', 'Retirada de itens do estoque para um setor (RF06)')}"></header>

        <div class="app-content">

            <div class="alert alert-danger d-flex align-items-start gap-2"
                 th:if="${erro}">
                <i class="bi bi-exclamation-circle fs-5"></i>
                <span th:text="${erro}"></span>
            </div>

            <form th:action="@{/movimentacoes/saida}" th:object="${movimentacao}" method="post" class="card">
                <div class="card-pad">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Data</label>
                            <input type="datetime-local" class="form-control" th:field="*{data}">
                        </div>

                        <div class="col-md-8">
                            <label class="form-label">Material *</label>
                            <select name="materialId" class="form-select" required>
                                <option value="">— Selecione —</option>
                                <option th:each="m : ${materiais}"
                                        th:value="${m.id}"
                                        th:text="${m.nome + ' (saldo: ' + m.estoqueAtual + ')'}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Quantidade *</label>
                            <input type="number" min="1" class="form-control" th:field="*{quantidade}" required>
                        </div>

                        <div class="col-md-8">
                            <label class="form-label">
                                Setor de destino <span class="text-danger">*</span>
                            </label>
                            <select name="setorId" class="form-select" required>
                                <option value="">— Selecione o setor —</option>
                                <option th:each="s : ${setores}"
                                        th:value="${s.id}"
                                        th:text="${s.nome + (s.codigoCentroCusto != null ? ' [' + s.codigoCentroCusto + ']' : '')}"></option>
                            </select>
                            <div class="form-text">Obrigatório por força da regra RN03.</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Quem retirou</label>
                            <input type="text" class="form-control" th:field="*{retiradoPor}"
                                   placeholder="Nome do responsável pela retirada">
                        </div>
                    </div>

                    <div class="alert alert-warning d-flex align-items-start gap-2 mt-4 mb-0">
                        <i class="bi bi-info-circle fs-5"></i>
                        <span>
                            A saída nasce com status <strong>PENDENTE_APROVACAO</strong> (RN04).
                            O estoque só será debitado após a aprovação do gestor.
                        </span>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Registrar saída
                        </button>
                        <a href="/movimentacoes" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </div>
            </form>

        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
