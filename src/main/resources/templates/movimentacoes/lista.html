<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movimentações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container"><a class="navbar-brand" href="/">Almoxarifado</a></div>
</nav>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Movimentações</h2>
        <a class="btn btn-success" href="/movimentacoes/saida/nova">Nova Saída</a>
    </div>

    <table class="table table-striped bg-white shadow-sm align-middle">
        <thead class="table-dark">
        <tr>
            <th>#</th><th>Data</th><th>Tipo</th><th>Material</th>
            <th>Qtd</th><th>Setor Destino</th><th>Retirado por</th>
            <th>Status (RN04)</th><th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${movimentacoes}">
            <td th:text="${m.id}"></td>
            <td th:text="${#temporals.format(m.data, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${m.tipo}"></td>
            <td th:text="${m.material.nome}"></td>
            <td th:text="${m.quantidade}"></td>
            <td th:text="${m.setorDestino != null ? m.setorDestino.nome : '-'}"></td>
            <td th:text="${m.retiradoPor} ?: '-'"></td>
            <td>
                <span class="badge"
                      th:classappend="${m.status.name() == 'PENDENTE_APROVACAO'} ? 'bg-warning text-dark'
                                    : (${m.status.name() == 'APROVADO'} ? 'bg-info'
                                    : (${m.status.name() == 'ENTREGUE'} ? 'bg-success'
                                    : 'bg-danger'))"
                      th:text="${m.status}"></span>
            </td>
            <td>
                <!-- RN04 - aprovação por gestor (só aqui o estoque é debitado) -->
                <form th:if="${m.status.name() == 'PENDENTE_APROVACAO'}"
                      th:action="@{|/movimentacoes/${m.id}/status|}" method="post" class="d-inline">
                    <input type="hidden" name="status" value="APROVADO">
                    <button class="btn btn-sm btn-info">Aprovar</button>
                </form>
                <form th:if="${m.status.name() == 'APROVADO'}"
                      th:action="@{|/movimentacoes/${m.id}/status|}" method="post" class="d-inline">
                    <input type="hidden" name="status" value="ENTREGUE">
                    <button class="btn btn-sm btn-success">Entregar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(movimentacoes)}">
            <td colspan="9" class="text-center text-muted">Nenhuma movimentação registrada.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
