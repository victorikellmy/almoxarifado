<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Movimentações')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('movimentacoes')}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Movimentações',
                              'Histórico de entradas, saídas e compras diretas')}"></header>

        <div class="app-content">

            <div class="page-header">
                <div></div>
                <a class="btn btn-primary" href="/movimentacoes/saida/nova">
                    <i class="bi bi-box-arrow-up"></i> Nova saída
                </a>
            </div>

            <!-- Filtros -->
            <div class="card mb-3">
                <div class="card-body">
                    <form method="get" action="/movimentacoes" class="row g-2 align-items-end">
                        <div class="col-md-2">
                            <label class="form-label small text-muted mb-1">Tipo</label>
                            <select name="tipo" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option value="ENTRADA"       th:selected="${filtroTipo?.name() == 'ENTRADA'}">Entrada</option>
                                <option value="SAIDA"         th:selected="${filtroTipo?.name() == 'SAIDA'}">Saída</option>
                                <option value="COMPRA_DIRETA" th:selected="${filtroTipo?.name() == 'COMPRA_DIRETA'}">Compra direta</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small text-muted mb-1">Status</label>
                            <select name="status" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option value="PENDENTE_APROVACAO" th:selected="${filtroStatus?.name() == 'PENDENTE_APROVACAO'}">Pendente</option>
                                <option value="APROVADO"           th:selected="${filtroStatus?.name() == 'APROVADO'}">Aprovado</option>
                                <option value="ENTREGUE"           th:selected="${filtroStatus?.name() == 'ENTREGUE'}">Entregue</option>
                                <option value="REJEITADO"          th:selected="${filtroStatus?.name() == 'REJEITADO'}">Rejeitado</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small text-muted mb-1">Setor</label>
                            <select name="setorId" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option th:each="s : ${setores}"
                                        th:value="${s.id}"
                                        th:text="${s.nome}"
                                        th:selected="${filtroSetorId != null and filtroSetorId == s.id}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small text-muted mb-1">De</label>
                            <input type="date" name="inicio" class="form-control form-control-sm"
                                   th:value="${filtroInicio}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small text-muted mb-1">Até</label>
                            <input type="date" name="fim" class="form-control form-control-sm"
                                   th:value="${filtroFim}">
                        </div>
                        <div class="col-md-2 d-flex gap-2">
                            <button class="btn btn-sm btn-primary flex-grow-1">
                                <i class="bi bi-funnel"></i> Filtrar
                            </button>
                            <a href="/movimentacoes" class="btn btn-sm btn-outline-secondary" title="Limpar filtros">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card table-card">
                <div class="table-card-head">
                    <div>
                        <h5 class="mb-0">Histórico</h5>
                        <small class="text-muted">
                            <span th:text="${page.totalElements}"></span> movimentação(ões)
                            <span th:if="${page.totalPages > 1}">
                                — página <span th:text="${page.number + 1}"></span>
                                de <span th:text="${page.totalPages}"></span>
                            </span>
                        </small>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Data</th>
                            <th>Tipo</th>
                            <th>Itens</th>
                            <th class="text-end">Qtd. total</th>
                            <th>Setor destino</th>
                            <th>Retirado por</th>
                            <th>Status</th>
                            <th class="text-end">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="m : ${page.content}" style="cursor:pointer;"
                            th:onclick="|window.location.href='/movimentacoes/${m.id}'|">
                            <td class="text-muted" th:text="${m.id}"></td>
                            <td class="text-muted small" th:text="${#temporals.format(m.data, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <span th:if="${m.tipo.name() == 'ENTRADA'}" class="badge bg-success">
                                    <i class="bi bi-box-arrow-in-down"></i> Entrada
                                </span>
                                <span th:if="${m.tipo.name() == 'SAIDA'}" class="badge bg-info">
                                    <i class="bi bi-box-arrow-up"></i> Saída
                                </span>
                                <span th:if="${m.tipo.name() == 'COMPRA_DIRETA'}" class="badge bg-primary">
                                    <i class="bi bi-cart3"></i> Compra direta
                                </span>
                            </td>
                            <td>
                                <span class="badge bg-secondary me-1"
                                      th:text="${#lists.size(m.itens)} + ' item(ns)'"></span>
                                <span class="text-muted small" th:text="${m.resumoItens}"></span>
                            </td>
                            <td class="text-end fw-bold" th:text="${m.quantidadeTotal}"></td>
                            <td>
                                <span th:if="${m.setorDestino != null}" th:text="${m.setorDestino.nome}"></span>
                                <span th:if="${m.setorDestino == null}" class="placeholder-dash">—</span>
                            </td>
                            <td>
                                <span th:if="${m.retiradoPor != null}" class="small"
                                      th:text="${m.retiradoPor}"></span>
                                <span th:if="${m.retiradoPor == null}" class="placeholder-dash">—</span>
                            </td>
                            <td>
                                <span class="status-pill"
                                      th:classappend="${m.status.name() == 'PENDENTE_APROVACAO'} ? 'text-warning'
                                                    : (${m.status.name() == 'APROVADO'} ? 'text-info'
                                                    : (${m.status.name() == 'ENTREGUE'} ? 'text-success'
                                                    : 'text-danger'))"
                                      th:style="${m.status.name() == 'PENDENTE_APROVACAO'} ? 'background:#fef3c7;'
                                              : (${m.status.name() == 'APROVADO'} ? 'background:#e0f2fe;'
                                              : (${m.status.name() == 'ENTREGUE'} ? 'background:#d1fae5;'
                                              : 'background:#fee2e2;'))"
                                      th:text="${m.status}"></span>
                            </td>
                            <td class="text-end" onclick="event.stopPropagation();">
                                <a th:href="@{|/movimentacoes/${m.id}|}"
                                   class="btn btn-sm btn-outline-secondary"
                                   title="Ver itens da movimentação">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <form th:if="${m.status.name() == 'PENDENTE_APROVACAO'}"
                                      th:action="@{|/movimentacoes/${m.id}/status|}" method="post" class="d-inline">
                                    <input type="hidden" name="status" value="APROVADO">
                                    <button class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-check-circle"></i> Aprovar
                                    </button>
                                </form>
                                <form th:if="${m.status.name() == 'APROVADO'}"
                                      th:action="@{|/movimentacoes/${m.id}/status|}" method="post" class="d-inline">
                                    <input type="hidden" name="status" value="ENTREGUE">
                                    <button class="btn btn-sm btn-success">
                                        <i class="bi bi-truck"></i> Entregar
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${page.empty}">
                            <td colspan="9" class="empty-state">
                                <i class="bi bi-clock-history d-block mb-2"></i>
                                Nenhuma movimentação encontrada com os filtros atuais.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/pagination :: paginacao(${page}, '/movimentacoes')}"></div>
            </div>

        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
