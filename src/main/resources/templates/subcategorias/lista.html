<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Subcategorias')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('subcategorias')}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Subcategorias', 'Subdivisões dentro de cada área (RF17 — Nível 2)')}"></header>

        <div class="app-content">

            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

            <div class="card mb-4">
                <div class="card-pad">
                    <h5 class="mb-1"><i class="bi bi-plus-circle me-1"></i> Nova subcategoria</h5>
                    <p class="text-muted small mb-3">
                        A sigla compõe o segmento do meio do SKU
                        (ex.: <code>ODO-<strong>CON</strong>-00001</code>).
                    </p>

                    <form th:action="@{/subcategorias}" th:object="${subcategoria}" method="post">
                        <div class="row g-2">
                            <div class="col-md-3">
                                <label class="form-label">Área</label>
                                <select class="form-select" th:field="*{area}" required>
                                    <option value="">— Selecione —</option>
                                    <option th:each="a : ${areas}" th:value="${a.id}"
                                            th:text="${a.sigla + ' — ' + a.nome}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" placeholder="Ex.: Consumo"
                                       th:field="*{nome}" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Sigla</label>
                                <input type="text" class="form-control text-uppercase"
                                       placeholder="CON" maxlength="5"
                                       pattern="[A-Za-z0-9]{2,5}"
                                       th:field="*{sigla}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Descrição</label>
                                <input type="text" class="form-control" th:field="*{descricao}">
                            </div>
                            <div class="col-md-1 d-flex align-items-end">
                                <button class="btn btn-primary w-100">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card table-card">
                <div class="table-card-head d-flex align-items-center justify-content-between flex-wrap gap-2">
                    <div>
                        <h5 class="mb-0">Subcategorias cadastradas</h5>
                        <small class="text-muted">
                            <span th:text="${#lists.size(subcategorias)}"></span> registro(s)
                            <span th:if="${areaSelecionada != null}" class="ms-1">
                                · filtradas por área
                            </span>
                        </small>
                    </div>

                    <!-- Filtro por Área -->
                    <form method="get" th:action="@{/subcategorias}" class="d-flex align-items-center gap-2">
                        <label for="filtro-area" class="form-label small mb-0 text-muted">Filtrar por área:</label>
                        <select id="filtro-area" name="areaId" class="form-select form-select-sm"
                                style="min-width:220px;" onchange="this.form.submit()">
                            <option value="">Todas as áreas</option>
                            <option th:each="a : ${areas}"
                                    th:value="${a.id}"
                                    th:selected="${areaSelecionada != null and areaSelecionada == a.id}"
                                    th:text="${a.sigla + ' — ' + a.nome}"></option>
                        </select>
                        <a th:if="${areaSelecionada != null}" th:href="@{/subcategorias}"
                           class="btn btn-sm btn-outline-secondary" title="Limpar filtro">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </form>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Área</th>
                            <th>Sigla</th>
                            <th>Nome</th>
                            <th class="text-end">Próximo SKU</th>
                            <th class="text-end">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${subcategorias}">
                            <td class="text-muted" th:text="${s.id}"></td>
                            <td>
                                <span class="badge bg-primary me-1" th:text="${s.area.sigla}"></span>
                                <span class="text-muted small" th:text="${s.area.nome}"></span>
                            </td>
                            <td><span class="badge bg-info" th:text="${s.sigla}"></span></td>
                            <td class="fw-semibold" th:text="${s.nome}"></td>
                            <td class="text-end">
                                <code th:text="${s.area.sigla + '-' + s.sigla + '-'
                                                + #numbers.formatInteger(s.proximoSequencial != null ? s.proximoSequencial : 1, 5, 'NONE')}"></code>
                            </td>
                            <td class="text-end">
                                <a th:href="@{|/subcategorias/${s.id}/editar|}"
                                   class="btn btn-sm btn-outline-primary"
                                   title="Editar nome/descrição">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{|/subcategorias/${s.id}/excluir|}" method="post" class="d-inline"
                                      onsubmit="return confirm('Excluir esta subcategoria?');">
                                    <button class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(subcategorias)}">
                            <td colspan="6" class="empty-state">
                                <i class="bi bi-inbox d-block mb-2"></i>
                                Nenhuma subcategoria cadastrada.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
