<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Setores')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('setores')}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Setores', 'Centros de custo / departamentos da FPTO e do FA-Saúde (RF04)')}"></header>

        <div class="app-content">

            <div class="card mb-4">
                <div class="card-pad">
                    <h5 class="mb-3"><i class="bi bi-plus-circle me-1"></i> Novo setor</h5>
                    <form th:action="@{/setores}" th:object="${setor}" method="post">
                        <div class="alert alert-danger py-2" th:if="${#fields.hasErrors('*')}">
                            <ul class="mb-0 ps-3">
                                <li th:each="e : ${#fields.errors('*')}" th:text="${e}"></li>
                            </ul>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-2">
                                <label class="form-label">Organização *</label>
                                <select class="form-select" th:field="*{organizacao}" required>
                                    <option th:each="o : ${organizacoes}" th:value="${o}" th:text="${o.rotulo}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Nome do setor *</label>
                                <input type="text" class="form-control" th:field="*{nome}" required maxlength="120"
                                       placeholder="Ex.: Financeiro, Compras e Almoxarifado">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Responsável <small class="text-muted">(opcional)</small></label>
                                <input type="text" class="form-control" th:field="*{responsavel}" maxlength="120">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Centro de custo</label>
                                <input type="text" class="form-control" placeholder="Opcional" maxlength="30"
                                       th:field="*{codigoCentroCusto}">
                            </div>
                            <div class="col-md-1 d-flex align-items-end">
                                <button class="btn btn-primary w-100" title="Salvar setor">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-text mt-2">
                            Os setores são cadastrados sem pessoas (o acesso é controlado pelos grupos da rede).
                            FPTO e FA-Saúde podem ter setores com o mesmo nome; a organização é o que os diferencia.
                        </div>
                    </form>
                </div>
            </div>

            <div class="card table-card">
                <div class="table-card-head">
                    <div>
                        <h5 class="mb-0">Setores cadastrados</h5>
                        <small class="text-muted"><span th:text="${#lists.size(setores)}"></span> registro(s)</small>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Organização</th>
                            <th>Nome</th>
                            <th>Responsável</th>
                            <th>Centro de custo</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${setores}">
                            <td class="text-muted" th:text="${s.id}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${s.organizacao != null and s.organizacao.name() == 'FA_SAUDE'} ? 'bg-info text-dark' : 'bg-primary'"
                                      th:text="${s.organizacao != null ? s.organizacao.sigla : 'FPTO'}"></span>
                            </td>
                            <td class="fw-semibold" th:text="${s.nome}"></td>
                            <td th:text="${s.responsavel} ?: '—'"></td>
                            <td>
                                <span th:if="${s.codigoCentroCusto}" class="badge bg-secondary"
                                      th:text="${s.codigoCentroCusto}"></span>
                                <span th:unless="${s.codigoCentroCusto}" class="text-muted">—</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(setores)}">
                            <td colspan="5" class="empty-state">
                                <i class="bi bi-inbox d-block mb-2"></i>
                                Nenhum setor cadastrado.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
