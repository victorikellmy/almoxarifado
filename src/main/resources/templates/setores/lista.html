<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Setores')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('setores')}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Setores', 'Centros de custo / departamentos (RF04)')}"></header>

        <div class="app-content">

            <div class="card mb-4">
                <div class="card-pad">
                    <h5 class="mb-3"><i class="bi bi-plus-circle me-1"></i> Novo setor</h5>
                    <form th:action="@{/setores}" th:object="${setor}" method="post">
                        <div class="row g-2">
                            <div class="col-md-4">
                                <label class="form-label">Nome do setor</label>
                                <input type="text" class="form-control" th:field="*{nome}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Responsável</label>
                                <input type="text" class="form-control" th:field="*{responsavel}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Centro de custo</label>
                                <input type="text" class="form-control" placeholder="Opcional"
                                       th:field="*{codigoCentroCusto}">
                            </div>
                            <div class="col-md-1 d-flex align-items-end">
                                <button class="btn btn-primary w-100">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card table-card">
                <div class="table-card-head">
                    <div>
                        <h5 class="mb-0">Setores cadastrados</h5>
                        <small class="text-muted"><span th:text="${#lists.size(setores)}"></span> registro(s)</small>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>Responsável</th>
                            <th>Centro de custo</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${setores}">
                            <td class="text-muted" th:text="${s.id}"></td>
                            <td class="fw-semibold" th:text="${s.nome}"></td>
                            <td th:text="${s.responsavel}"></td>
                            <td>
                                <span th:if="${s.codigoCentroCusto}" class="badge bg-secondary"
                                      th:text="${s.codigoCentroCusto}"></span>
                                <span th:unless="${s.codigoCentroCusto}" class="text-muted">—</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(setores)}">
                            <td colspan="4" class="empty-state">
                                <i class="bi bi-inbox d-block mb-2"></i>
                                Nenhum setor cadastrado.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
