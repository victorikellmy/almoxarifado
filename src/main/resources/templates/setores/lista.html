<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Setores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container"><a class="navbar-brand" href="/">Almoxarifado</a></div>
</nav>
<div class="container py-4">
    <h2>Setores / Centros de Custo <small class="text-muted">(RF04)</small></h2>

    <form th:action="@{/setores}" th:object="${setor}" method="post" class="card p-3 mb-4 shadow-sm">
        <div class="row g-2">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Nome do setor" th:field="*{nome}" required>
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Responsável" th:field="*{responsavel}" required>
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="Centro de custo (opcional)" th:field="*{codigoCentroCusto}">
            </div>
            <div class="col-md-1">
                <button class="btn btn-primary w-100">+</button>
            </div>
        </div>
    </form>

    <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
        <tr><th>#</th><th>Nome</th><th>Responsável</th><th>Centro de Custo</th></tr>
        </thead>
        <tbody>
        <tr th:each="s : ${setores}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.nome}"></td>
            <td th:text="${s.responsavel}"></td>
            <td th:text="${s.codigoCentroCusto} ?: '-'"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
