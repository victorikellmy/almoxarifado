<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Material')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('materiais')}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout ::
                              topbar(${material.id} != null ? 'Editar material' : 'Novo material',
                                     'O SKU é gerado automaticamente a partir da Área e Subcategoria (RF18)')}"></header>

        <div class="app-content">

            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

            <form th:action="@{/materiais}" th:object="${material}" method="post" class="card">
                <div class="card-pad">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Nome do material *</label>
                            <input type="text" class="form-control" th:field="*{nome}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">SKU</label>
                            <input type="text" class="form-control" style="background:#f8fafc;"
                                   th:field="*{codigoSku}"
                                   placeholder="(gerado após salvar)" readonly>
                            <div class="form-text">Atribuído automaticamente no cadastro.</div>
                        </div>
                    </div>

                    <hr class="my-4">
                    <h6 class="text-muted text-uppercase small mb-3" style="letter-spacing:.05em;">
                        Categorização
                    </h6>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Área *</label>
                            <select id="area-select" class="form-select" required>
                                <option value="">— Selecione —</option>
                                <option th:each="a : ${areas}"
                                        th:value="${a.id}"
                                        th:text="${a.sigla + ' — ' + a.nome}"
                                        th:selected="${material.subcategoria != null
                                                   and material.subcategoria.area != null
                                                   and material.subcategoria.area.id == a.id}"></option>
                            </select>
                            <div class="form-text">
                                <i class="bi bi-link-45deg"></i>
                                <a href="/areas" target="_blank">Cadastrar nova área</a>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Subcategoria *</label>
                            <select id="subcategoria-select" class="form-select"
                                    th:field="*{subcategoria}" required>
                                <option value="">— Selecione —</option>
                                <option th:if="${subcategorias != null}"
                                        th:each="s : ${subcategorias}"
                                        th:value="${s.id}"
                                        th:text="${s.sigla + ' — ' + s.nome}"></option>
                            </select>
                            <div class="form-text">
                                <i class="bi bi-link-45deg"></i>
                                <a href="/subcategorias" target="_blank">Cadastrar nova subcategoria</a>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">
                    <h6 class="text-muted text-uppercase small mb-3" style="letter-spacing:.05em;">
                        Estoque & valores
                    </h6>

                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Unidade de medida</label>
                            <select class="form-select" th:field="*{unidadeMedida}">
                                <option value="">— Selecione —</option>
                                <option value="Unidade">Unidade</option>
                                <option value="Caixa">Caixa</option>
                                <option value="Pacote">Pacote</option>
                                <option value="Kg">Kg</option>
                                <option value="Litro">Litro</option>
                                <option value="Frasco">Frasco</option>
                                <option value="Galão">Galão</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Estoque mínimo *</label>
                            <input type="number" min="0" class="form-control"
                                   th:field="*{estoqueMinimo}" required>
                            <div class="form-text">Usado pelo alerta da RN06.</div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Estoque atual</label>
                            <input type="number" class="form-control" style="background:#f8fafc;"
                                   th:field="*{estoqueAtual}" readonly>
                            <div class="form-text">Atualizado por entradas/saídas.</div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Valor unitário (R$)</label>
                            <input type="number" step="0.01" class="form-control"
                                   th:field="*{valorUnitario}">
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Salvar
                        </button>
                        <a href="/materiais" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </div>
            </form>

        </div>
    </main>
</div>

<script>
    (function () {
        const areaSelect = document.getElementById('area-select');
        const subSelect  = document.getElementById('subcategoria-select');

        async function carregarSubcategorias(areaId) {
            subSelect.innerHTML = '<option value="">— Selecione —</option>';
            if (!areaId) return;
            try {
                const resp = await fetch(`/subcategorias/api/por-area/${areaId}`,
                                         { headers: { 'Accept': 'application/json' } });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const lista = await resp.json();
                lista.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = `${s.sigla} — ${s.nome}`;
                    subSelect.appendChild(opt);
                });
            } catch (err) {
                console.error('Falha ao carregar subcategorias:', err);
            }
        }
        areaSelect.addEventListener('change', () => carregarSubcategorias(areaSelect.value));
    })();
</script>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
