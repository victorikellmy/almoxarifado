<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Material</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container"><a class="navbar-brand" href="/">Almoxarifado</a></div>
</nav>
<div class="container py-4">
    <h2 th:text="${material.id} != null ? 'Editar Material' : 'Novo Material'"></h2>

    <form th:action="@{/materiais}" th:object="${material}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:field="*{id}">

        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" th:field="*{nome}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">SKU / Código</label>
                <input type="text" class="form-control" th:field="*{codigoSku}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Categoria</label>
                <select class="form-select" th:field="*{categoria}">
                    <option th:value="null">-- Sem categoria --</option>
                    <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Unidade de Medida</label>
                <select class="form-select" th:field="*{unidadeMedida}">
                    <option value="">-- Selecione --</option>
                    <option value="Unidade">Unidade</option>
                    <option value="Caixa">Caixa</option>
                    <option value="Pacote">Pacote</option>
                    <option value="Kg">Kg</option>
                    <option value="Litro">Litro</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Estoque Mínimo</label>
                <input type="number" min="0" class="form-control" th:field="*{estoqueMinimo}" required>
                <div class="form-text">Usado pelo alerta da RN06.</div>
            </div>

            <div class="col-md-3">
                <label class="form-label">Estoque Atual</label>
                <input type="number" class="form-control" th:field="*{estoqueAtual}" readonly>
                <div class="form-text">Atualizado por entradas/saídas.</div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Valor Unitário</label>
                <input type="number" step="0.01" class="form-control" th:field="*{valorUnitario}">
            </div>
        </div>

        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-success">Salvar</button>
            <a href="/materiais" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
