<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Materiais')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('materiais')}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Materiais', 'Catálogo do almoxarifado (RF12)')}"></header>

        <div class="app-content">

            <div class="page-header">
                <div></div>
                <a href="/materiais/novo" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Novo material
                </a>
            </div>

            <!-- Bloco de alerta consolidado (RN06) -->
            <div th:if="${qtdAlertas > 0}" class="alert alert-warning d-flex align-items-start gap-2 mb-4">
                <i class="bi bi-exclamation-triangle fs-5"></i>
                <div>
                    <strong><span th:text="${qtdAlertas}"></span> material(is) abaixo do mínimo.</strong>
                    <a href="/materiais?emAlerta=true" class="alert-link ms-1">Ver apenas em alerta</a>
                </div>
            </div>

            <!-- Filtros -->
            <div class="card mb-3">
                <div class="card-body">
                    <form method="get" action="/materiais" class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label small text-muted mb-1">Nome</label>
                            <input type="text" name="nome" class="form-control form-control-sm"
                                   th:value="${filtroNome}" placeholder="Busca parcial...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small text-muted mb-1">SKU</label>
                            <input type="text" name="sku" class="form-control form-control-sm"
                                   th:value="${filtroSku}" placeholder="Prefixo do SKU">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small text-muted mb-1">Área</label>
                            <select name="areaId" class="form-select form-select-sm">
                                <option value="">Todas</option>
                                <option th:each="a : ${areas}"
                                        th:value="${a.id}"
                                        th:text="${a.nome}"
                                        th:selected="${filtroAreaId != null and filtroAreaId == a.id}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small text-muted mb-1">Estoque</label>
                            <select name="emAlerta" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option value="true" th:selected="${filtroEmAlerta != null and filtroEmAlerta}">Em alerta</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button class="btn btn-sm btn-primary flex-grow-1">
                                <i class="bi bi-funnel"></i> Filtrar
                            </button>
                            <a href="/materiais" class="btn btn-sm btn-outline-secondary" title="Limpar filtros">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card table-card">
                <div class="table-card-head">
                    <div>
                        <h5 class="mb-0">Lista de materiais</h5>
                        <small class="text-muted">
                            <span th:text="${page.totalElements}"></span> registro(s)
                            <span th:if="${page.totalPages > 1}">
                                — página <span th:text="${page.number + 1}"></span>
                                de <span th:text="${page.totalPages}"></span>
                            </span>
                        </small>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>SKU</th>
                            <th>Nome</th>
                            <th>Área / Subcategoria</th>
                            <th>Unidade</th>
                            <th class="text-end">Estoque</th>
                            <th class="text-end">Mínimo</th>
                            <th>Status</th>
                            <th class="text-end">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="m : ${page.content}">
                            <td><code th:text="${m.codigoSku} ?: '—'"></code></td>
                            <td class="fw-semibold" th:text="${m.nome}"></td>
                            <td>
                                <span th:if="${m.subcategoria}">
                                    <span class="badge bg-primary me-1" th:text="${m.subcategoria.area.sigla}"></span>
                                    <span class="badge bg-info me-1" th:text="${m.subcategoria.sigla}"></span>
                                    <span class="text-muted small" th:text="${m.subcategoria.nome}"></span>
                                </span>
                            </td>
                            <td class="text-muted" th:text="${m.unidadeMedida} ?: '—'"></td>
                            <td class="text-end fw-bold"
                                th:classappend="${m.estoqueAbaixoDoMinimo} ? 'text-danger'"
                                th:text="${m.estoqueAtual}"></td>
                            <td class="text-end text-muted" th:text="${m.estoqueMinimo}"></td>
                            <td>
                                <th:block th:if="${m.estoqueAbaixoDoMinimo}"><span
                                        th:replace="~{fragments/status :: pill('Repor')}"></span></th:block>
                                <th:block th:unless="${m.estoqueAbaixoDoMinimo}"><span
                                        th:replace="~{fragments/status :: pill('OK')}"></span></th:block>
                            </td>
                            <td class="text-end">
                                <a th:href="@{|/materiais/${m.id}/etiqueta|}"
                                   class="btn btn-sm btn-outline-secondary"
                                   title="Imprimir etiqueta com código de barras">
                                    <i class="bi bi-upc-scan"></i>
                                </a>
                                <a th:href="@{|/materiais/${m.id}/editar|}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${page.empty}">
                            <td colspan="8" class="empty-state">
                                <i class="bi bi-inbox d-block mb-2"></i>
                                Nenhum material encontrado com os filtros atuais.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/pagination :: paginacao(${page}, '/materiais')}"></div>
            </div>

        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
