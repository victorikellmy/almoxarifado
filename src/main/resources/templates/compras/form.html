<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nova pré-compra')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('compras')}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Nova pré-compra', 'Lance a solicitação física e anexe o PDF (RF14)')}"></header>

        <div class="app-content">

            <div class="alert alert-danger d-flex align-items-start gap-2" th:if="${erro}">
                <i class="bi bi-exclamation-circle fs-5"></i>
                <span th:text="${erro}"></span>
            </div>

            <form th:action="@{/compras}" th:object="${compra}" method="post"
                  enctype="multipart/form-data" class="card">
                <div class="card-pad">

                    <h6 class="text-muted text-uppercase small mb-3" style="letter-spacing:.05em;">
                        Dados da compra
                    </h6>

                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Tipo *</label>
                            <select th:field="*{tipo}" id="tipo" class="form-select" required>
                                <option value="">— Selecione —</option>
                                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>

                        <div class="col-md-5 d-none" id="setor-wrapper">
                            <label class="form-label">
                                Setor solicitante <span class="text-danger">*</span>
                            </label>
                            <select name="setorSolicitanteId" id="setor" class="form-select" disabled>
                                <option value="">— Selecione —</option>
                                <option th:each="s : ${setores}" th:value="${s.id}" th:text="${s.nome}"></option>
                            </select>
                            <div class="form-text">Obrigatório para compra DIRETA (RN08).</div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Fornecedor</label>
                            <input type="text" class="form-control" th:field="*{fornecedor}"
                                   placeholder="Opcional">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Valor estimado (R$)</label>
                            <input type="number" step="0.01" min="0" class="form-control"
                                   th:field="*{valorEstimado}">
                            <div class="form-text">Se zero, será calculado pela soma dos itens.</div>
                        </div>

                        <div class="col-md-9">
                            <label class="form-label">Observação</label>
                            <input type="text" class="form-control" th:field="*{observacao}">
                        </div>
                    </div>

                    <hr class="my-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="text-muted text-uppercase small mb-0" style="letter-spacing:.05em;">
                            Itens solicitados
                        </h6>
                        <button type="button" class="btn btn-sm btn-outline-primary" id="btn-adicionar-item"
                                data-repeater-add="#tabela-itens tbody">
                            <i class="bi bi-plus-lg"></i> Adicionar item
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table mb-0" id="tabela-itens">
                            <thead>
                            <tr>
                                <th style="width:50%">Material</th>
                                <th style="width:15%">Quantidade</th>
                                <th style="width:25%">Valor unitário (R$)</th>
                                <th style="width:10%"></th>
                            </tr>
                            </thead>
                            <tbody data-repeater>
                            <tr class="linha-item" data-repeater-item>
                                <td>
                                    <select name="itemMaterialId" class="form-select" required>
                                        <option value="">— Selecione —</option>
                                        <option th:each="m : ${materiais}"
                                                th:value="${m.id}"
                                                th:text="${m.nome + ' (' + m.unidadeMedida + ')'}"></option>
                                    </select>
                                </td>
                                <td><input type="number" name="itemQuantidade" min="1" class="form-control" required></td>
                                <td><input type="number" name="itemValorUnitario" step="0.01" min="0"
                                           class="form-control" value="0"></td>
                                <td>
                                    <button type="button" class="btn btn-sm btn-outline-danger btn-remover"
                                            data-repeater-remove>
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <hr class="my-4">

                    <h6 class="text-muted text-uppercase small mb-3" style="letter-spacing:.05em;">
                        Anexo
                    </h6>
                    <label class="form-label">PDF da solicitação física <small class="text-muted">(RF16)</small></label>
                    <input type="file" name="pdfSolicitacao" accept="application/pdf" class="form-control">
                    <div class="form-text">Aceita apenas arquivos PDF.</div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Salvar pré-compra
                        </button>
                        <a href="/compras" class="btn btn-outline-secondary">Cancelar</a>
                    </div>

                </div>
            </form>

        </div>
    </main>
</div>

<script>
    (function () {
        const tipoSelect = document.getElementById('tipo');
        const setorSelect = document.getElementById('setor');
        const setorWrapper = document.getElementById('setor-wrapper');

        function aplicarRegrasDoTipo() {
            const isDireta = tipoSelect.value === 'DIRETA';
            setorWrapper.classList.toggle('d-none', !isDireta);
            setorSelect.disabled = !isDireta;
            setorSelect.required = isDireta;
            if (!isDireta) setorSelect.value = '';
        }
        tipoSelect.addEventListener('change', aplicarRegrasDoTipo);
        aplicarRegrasDoTipo();
    })();
</script>
<script th:src="@{/js/repeater.js}" defer></script>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
