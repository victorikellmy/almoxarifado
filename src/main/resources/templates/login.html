<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Almoxarifado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Mesmos design tokens do layout principal, aplicados à tela cheia. */
        :root {
            --brand: #4f46e5;
            --brand-hover: #4338ca;
            --bg-sidebar: #0f172a;
            --text-muted: #64748b;
            --border: #e5e7eb;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 55%, #312e81 100%);
            font-size: 14px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 14px;
            padding: 2.25rem;
            box-shadow: 0 20px 60px rgba(2, 6, 23, .45);
        }
        .login-logo {
            width: 46px; height: 46px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: grid; place-items: center;
            color: #fff; font-weight: 700; font-size: 1.3rem;
        }
        .form-label { font-size: .8rem; font-weight: 600; }
        .form-control {
            border-radius: 8px;
            padding: .55rem .8rem;
        }
        .form-control:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(79,70,229,.15);
        }
        .btn-entrar {
            background: var(--brand);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 8px;
            padding: .6rem;
        }
        .btn-entrar:hover { background: var(--brand-hover); color: #fff; }
        .alert { font-size: .85rem; border-radius: 10px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="d-flex align-items-center gap-3 mb-4">
        <div class="login-logo">A</div>
        <div>
            <h1 class="h5 mb-0 fw-bold">Almoxarifado</h1>
            <small class="text-muted">Fundação · Acesso restrito</small>
        </div>
    </div>

    <div th:if="${param.erro}" class="alert alert-danger d-flex align-items-center gap-2">
        <i class="bi bi-x-circle"></i>
        <span>Usuário ou senha inválidos — ou conta desativada.</span>
    </div>
    <div th:if="${param.saiu}" class="alert alert-success d-flex align-items-center gap-2">
        <i class="bi bi-check-circle"></i>
        <span>Você saiu do sistema com segurança.</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">Usuário</label>
            <input type="text" class="form-control" id="username" name="username"
                   autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Senha</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-entrar w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
        </button>
    </form>

    <p class="text-center text-muted mt-4 mb-0" style="font-size: .75rem;">
        <i class="bi bi-shield-lock me-1"></i>Acesso monitorado — uso exclusivo de pessoal autorizado.
    </p>
</div>
</body>
</html>
