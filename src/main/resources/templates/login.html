<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Almoxarifado</title>
    <!-- Sem favicon declarado o navegador pede /favicon.ico, que não existe (404). -->
    <link rel="icon" type="image/png" th:href="@{/images/favicon-48.png}">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Mesmos tokens e componentes do shell (FPTO Design System) -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- Aplica o tema salvo antes do primeiro paint, como no layout -->
    <script>
        (function () {
            var stored = localStorage.getItem('alm-theme');
            var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            var theme = stored || prefers;
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
</head>
<body class="login-page">
<main class="login-card" aria-labelledby="login-titulo">
    <div class="login-logo">
        <img th:src="@{/images/logo-color.png}" alt="Fundação Pró-Tocantins" class="login-logo-light">
        <img th:src="@{/images/logo-white.png}" alt="Fundação Pró-Tocantins" class="login-logo-dark">
    </div>
    <div class="text-center mb-4">
        <h1 class="login-title" id="login-titulo">Almoxarifado</h1>
        <p class="login-subtitle">Fundação Pró-Tocantins · acesso restrito</p>
    </div>

    <div th:if="${param.erro}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-x-circle"></i>
        <span>Usuário ou senha inválidos, ou conta desativada.</span>
    </div>
    <div th:if="${param.saiu}" class="alert alert-success d-flex align-items-center gap-2" role="status">
        <i class="bi bi-check-circle"></i>
        <span>Sessão encerrada com segurança.</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">Usuário</label>
            <input type="text" class="form-control" id="username" name="username"
                   autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Senha</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
        </button>
    </form>

    <p class="login-foot">
        <i class="bi bi-shield-lock me-1"></i>Acesso monitorado. Uso exclusivo de pessoal autorizado.
    </p>
</main>
</body>
</html>
