# =============================================================================
# PERFIL DEV - desenvolvimento local, sem dependencias externas.
#
# H2 em memoria + DataSeeder (massa de demonstracao). NADA deste arquivo vale
# em producao: o perfil default exige PostgreSQL via variaveis de ambiente.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:almoxarifado;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Em dev o Hibernate cria/ajusta o schema sozinho; o Flyway fica desligado
# (as migrations sao escritas para PostgreSQL).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# Log de SQL via framework de logging (bufferizado, com nivel) em vez de
# spring.jpa.show-sql, que escreve sincrono em stdout statement a statement.
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# Sem HTTPS local - cookie Secure desligado para a sessao funcionar.
server.servlet.session.cookie.secure=false

# Admin padrao de desenvolvimento (em producao a senha vem de ADMIN_PASSWORD).
app.admin.username=admin
app.admin.password=Famsaudepm.

# Uploads ao lado do projeto em dev.
app.uploads.dir=./uploads
