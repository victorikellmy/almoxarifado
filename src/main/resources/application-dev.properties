# ===== Perfil DEV — H2 em memória, seeder e ferramentas de debug =====

# Desabilita suporte ao Docker Compose (H2 em memória nao precisa)
spring.docker.compose.enabled=false

# ===== Banco H2 (desenvolvimento) =====
spring.datasource.url=jdbc:h2:mem:almoxarifado;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Log de SQL via framework de logging (bufferizado, com nível) em vez de
# spring.jpa.show-sql, que escreve síncrono em stdout statement a statement.
logging.level.org.hibernate.SQL=debug

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
