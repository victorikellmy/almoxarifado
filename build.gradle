plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.netflix.dgs.codegen' version '8.3.0'
    // Plugin GraalVM Native removido: o deploy roda em JVM comum (java -jar).
    // O passo de AOT dele sobe o contexto Spring durante o build, o que exige
    // banco configurado e conflita com o fail-fast de produção.
}

group = 'com.fundacao'
version = '0.0.1-SNAPSHOT'
description = 'aualmoxarifado'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springModulithVersion', "2.0.6")
}

dependencies {
    // ---------- Core Spring Boot ----------
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Healthcheck do container (GET /actuator/health)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Migrations versionadas do schema PostgreSQL (src/main/resources/db/migration)
    // No Boot 4 a autoconfiguração do Flyway vive num módulo próprio — sem ele
    // as migrations não rodam no boot, mesmo com o flyway-core no classpath.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ---------- Security (login + perfis ADMIN/PADRAO) ----------
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // ---------- Planilhas e exporters (CSV/PDF/XLSX) ----------
    // POI atende tanto a importação em massa de materiais (.xlsx/.xls) quanto
    // a exportação dos relatórios.
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'com.github.librepdf:openpdf:1.3.34'

    // ---------- Cache em memória (idempotência da bipagem + relatórios) ----------
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // ---------- Runtime ----------
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // ---------- Lombok ----------
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ---------- Dev ----------
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ---------- Tests ----------
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

generateJava {
    schemaPaths = ["${projectDir}/src/main/resources/graphql-client"]
    packageName = 'com.fundacao.aualmoxarifado.codegen'
    generateClient = true
}

tasks.named('test') {
    useJUnitPlatform()
}

// Desenvolvimento local: `gradlew bootRun` sobe com o perfil dev (H2 em memória
// + dados de demonstração). Produção NUNCA passa por aqui — o container roda
// `java -jar` direto, caindo no perfil default, que exige PostgreSQL via
// variáveis de ambiente e falha rápido se faltarem.
tasks.named('bootRun') {
    args = ['--spring.profiles.active=dev']
}
