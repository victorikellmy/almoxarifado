plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fpto'
version = '0.0.1-SNAPSHOT'
description = 'aualmoxarifado'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()   // atalho de dev (se a fpto-commons estiver no ~/.m2)
    // GitHub Packages — fpto-commons (somente grupo com.fpto; demais deps vêm do mavenCentral).
    // Credenciais via env GITHUB_ACTOR/GITHUB_TOKEN ou props gpr.user/gpr.key (token com read:packages).
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/victorikellmy/fpto-commons')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
            password = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key')
        }
        content { includeGroup 'com.fpto' }
    }
    mavenCentral()
}

ext {
    set('springModulithVersion', "2.0.6")
}

dependencies {
    // Contratos e cross-cutting compartilhados do ecossistema FPTO
    implementation 'com.fpto:fpto-commons:0.1.0'

    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Migrações de banco (Flyway). Boot 4 modularizou as autoconfigs:
    // o módulo spring-boot-flyway precisa ser declarado explicitamente.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly    'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
